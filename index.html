<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <title>CryptoDemon Auth</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 40px;
    }

    .hidden {
      display: none;
    }

    input {
      margin: 4px;
    }

    textarea {
      width: 80%;
    }

    .tab {
      display: inline-block;
      padding: 10px;
      margin: 5px;
      background-color: #eee;
      cursor: pointer;
    }

    .tab.active {
      background-color: #ccc;
    }
  </style>
</head>

<body>
  <h2>🔥 CryptoDemon Auth</h2>

  <div>
    <span class="tab active" onclick="switchTab('login')">🔑 Login</span>
    <span class="tab" onclick="switchTab('register')">📝 Register</span>
  </div>

  <!-- LOGIN BLOCK -->
  <div id="loginBlock">
    <h3>🔐 Увійти</h3>
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button onclick="emailLogin()">Login via Email</button><br /><br />
    <button onclick="googleLogin()">Login via Google</button>
  </div>

  <!-- REGISTER BLOCK -->
  <div id="registerBlock" class="hidden">
    <h3>🆕 Зареєструватися</h3>
    <input type="email" id="regEmail" placeholder="Email" />
    <input type="password" id="regPassword" placeholder="Password" />
    <button onclick="emailRegister()">Register via Email</button><br /><br />
    <button onclick="googleLogin()">Register via Google</button>
  </div>

  <!-- EMAIL NOT VERIFIED -->
  <div id="notVerified" class="hidden">
    <h4>⚠️ Email не підтверджено</h4>
    <p>Будь ласка, перевірь пошту та підтверди свій email.</p>
    <button onclick="resendVerification()">📩 Надіслати ще раз</button>
  </div>

  <!-- COMPLETE PROFILE -->
  <div id="registration" class="hidden">
    <h3>👤 Доповнити профіль</h3>
    <input type="text" id="username" placeholder="username" /><br />
    <p>Введіть username, щоб завершити реєстрацію.</p>
    <button onclick="completeRegistration()">📩 Зареєструвати</button>
  </div>

  <h4>🔑 Token:</h4>
  <textarea id="tokenOutput" rows="6" readonly></textarea>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAy0wXYbwn9akfxSYSROt3qu8KkmcvzebA",
      authDomain: "crypto-demon.firebaseapp.com",
      projectId: "crypto-demon",
    };
    firebase.initializeApp(firebaseConfig);

    function switchTab(tab) {
      document.getElementById('loginBlock').classList.add('hidden');
      document.getElementById('registerBlock').classList.add('hidden');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (tab === 'login') {
        document.getElementById('loginBlock').classList.remove('hidden');
        document.querySelectorAll('.tab')[0].classList.add('active');
      } else {
        document.getElementById('registerBlock').classList.remove('hidden');
        document.querySelectorAll('.tab')[1].classList.add('active');
      }
    }

    let currentUser;

    async function emailLogin() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
        await handleLogin(cred.user);
      } catch (err) {
        alert("❌ Email Login Failed: " + err.message);
      }
    }

    async function emailRegister() {
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      try {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        await cred.user.sendEmailVerification();
        alert("📩 Ми надіслали листа для підтвердження email");
        await handleLogin(cred.user);
      } catch (err) {
        alert("❌ Email Register Failed: " + err.message);
      }
    }

    async function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        alert("ABOBA: ");
        await handleLogin(result.user);
      } catch (err) {
        alert("❌ Google Login Failed: " + err.message);
      }
    }

    async function handleLogin(user) {
      currentUser = user;
      await user.reload();

      if (!user.emailVerified && user.providerData[0].providerId === "password") {
        document.getElementById("notVerified").classList.remove("hidden");
        return;
      }

      const token = await user.getIdToken();
      document.getElementById("tokenOutput").value = token;
      window.firebaseUid = user.uid;

      // 🔍 Перевірка чи користувач існує
      const res = await fetch("http://localhost:3000/auth/verify", {
        method: "POST", 
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ 
          "token": token
        })
      });

      if (res.ok) {
    const data = await res.json();
    alert("✅ Вхід виконано");
    console.log("Користувач знайдений:", data.user);
  } else {
    const errorData = await res.json();
    switch (errorData.message) {
      case "Invalid or expired token":
        alert("❌ Токен недійсний або прострочений. Будь ласка, увійдіть знову.");
        break;
      case "User not found":
        alert("❌ Користувача не знайдено. Будь ласка, зареєструйтесь.");
        document.getElementById("registration").classList.remove("hidden");
        break;
      case "Email is required":
        alert("❌ Email відсутній у токені. Зверніться до адміністратора.");
        break;
      default:
        alert("❌ Невідома помилка. Спробуйте пізніше.");
        console.error("Помилка:", errorData);
    }
  }
    }

    async function resendVerification() {
      if (currentUser) {
        await currentUser.sendEmailVerification();
        alert("📨 Лист повторно надіслано");
      }
    }

    async function completeRegistration() {
      const username = document.getElementById("username").value;
      const token = document.getElementById("tokenOutput").value;

      const res = await fetch("http://localhost:3000/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          email: currentUser.email,
          firebaseUid: window.firebaseUid,
          username: username
        }),
      });

      if (res.ok) {
        alert("✅ Реєстрація завершена!");
        document.getElementById("registration").classList.add("hidden");
      } else {
        const err = await res.text();
        alert("❌ Помилка реєстрації: " + err);
      }
    }
  </script>

</body>

</html>
